name: Site checks

on:
  push:
    branches: [main, improve-project-quality]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-static-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local HTML links and assets
        run: python scripts/check_site.py
